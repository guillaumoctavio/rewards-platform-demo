apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rewards-platform-demo
spec:
  project: default
  source:
    repoURL: https://github.com/guillaumoctavio/rewards-platform-demo
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: rewards-demo
  syncPolicy:
    automated: { prune: true, selfHeal: true }
