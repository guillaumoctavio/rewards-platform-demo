apiVersion: apps/v1
kind: Deployment
metadata:
  name: rewards-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: rewards-service }
  template:
    metadata:
      labels: { app: rewards-service }
    spec:
      containers:
        - name: rewards-service
          image: ghcr.io/guillaumoctavio/rewards-service:latest
          envFrom:
            - secretRef: { name: rewards-platform-secrets }
